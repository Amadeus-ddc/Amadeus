[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amadeus-memory"
version = "0.1.0"
description = "An evolving memory system for LLM agents"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "networkx>=3.0",
    "numpy>=1.24",
    "torch>=2.0",
    "transformers>=4.30",
]

[project.optional-dependencies]
alfworld = ["ray>=2.0", "alfworld>=0.4.0"]
serve = ["vllm>=0.4"]
dev = ["pytest>=8.0", "black>=24.0", "isort>=5.0"]

[tool.setuptools.packages.find]
include = ["code*"]

[tool.setuptools.package-dir]
amadeus_collab = "code"
